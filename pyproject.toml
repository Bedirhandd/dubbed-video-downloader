[project]
name = "dubbed-video-downloader"
version = "0.1.0"
description = "Download YouTube videos or audio with a selected dubbed audio track."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langcodes==3.5.1",
    "PyYAML>=6.0.2",
    "rich>=15.0.0",
    "typer>=0.12.0",
    "yt-dlp>=2026.3.17",
    "yt-dlp-ejs>=0.8.0",
]

[project.scripts]
dbdvdl = "dubbed_video_downloader.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "coverage[toml]>=7.6.0",
    "pre-commit>=4.0.0",
    "ruff==0.15.17",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/dubbed_video_downloader"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
extend-ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["dubbed_video_downloader"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "B011"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
branch = true
relative_files = true
source_pkgs = ["dubbed_video_downloader"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
fail_under = 79

[tool.coverage.xml]
output = "coverage.xml"
