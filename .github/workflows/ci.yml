name: CI

on:
  push:
    branches:
      - main
      - feat/cli
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run Ruff linter
        run: uv run ruff check --output-format=github src tests

      - name: Check Ruff formatting
        run: uv run ruff format --check src tests

      - name: Run mypy
        run: uv run mypy

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.7"
          enable-cache: true

      - name: Verify audit detects known vulnerabilities
        run: |
          set +e
          output="$(uv audit --frozen --preview-features audit --project tests/fixtures/vulnerability-audit-negative 2>&1)"
          exit_code=$?
          set -e
          if [[ $exit_code -eq 0 ]]; then
            echo "Expected vulnerability audit to fail for negative fixture"
            exit 1
          fi
          if ! grep -qE 'Found [1-9][0-9]* known vulnerabilities' <<<"$output"; then
            echo "Expected audit output to report known vulnerabilities, but got:"
            echo "$output"
            exit 1
          fi
          if ! grep -q 'urllib3 1.26.4' <<<"$output"; then
            echo "Expected audit output to identify urllib3 1.26.4, but got:"
            echo "$output"
            exit 1
          fi

      - name: Audit project dependencies
        run: uv audit --frozen --preview-features audit

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      DBDVDL_TESTS_ALLOW_NETWORK: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run tests with coverage
        run: uv run pytest --cov=dubbed_video_downloader --cov-report=term --cov-report=xml:coverage.xml -v

      - name: Report coverage
        run: uv run coverage report

      - name: Enforce coverage threshold
        run: uv run coverage report --fail-under=79

      - name: Coverage summary
        run: uv run coverage report --skip-covered --skip-empty

      - name: Generate coverage XML
        run: uv run coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7
